<style>
/* Layout: one mobile column (max 460px) centred on ivory; one question per screen; sticky header with progress, sticky footer CTA. */
:root{
  --pink:#F2A7B8; --peach:#F6B48F; --lilac:#C986E4; --butter:#F4D96B; --ivory:#F7F1E8;
  --pink-t:#FCE6EC; --peach-t:#FDEADF; --lilac-t:#F3E4FA; --butter-t:#FCF3CF;
  --ink:#46222F; --ink-2:#6E5560; --line:rgba(70,34,47,.12); --card:#FFFCF7; --deep:#A8345C;
  --accent:var(--pink); --accent-t:var(--pink-t);
  --f-display:'Instrument Serif', 'Times New Roman', serif;
  --f-label:'Unbounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ivory)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:14px}

.stage{min-height:100%;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{position:relative;width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ivory);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.back[disabled]{visibility:hidden}
.count{font-family:var(--f-label);font-size:12px;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar{position:relative;height:6px;border-radius:999px;background:rgba(70,34,47,.08);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--ivory);transition:left .45s cubic-bezier(.2,.8,.2,1)}

/* screen */
.screen{flex:1;display:flex;flex-direction:column;padding-block:8px 24px;animation:in .38s cubic-bezier(.2,.8,.2,1) both}
.screen.back-anim{animation-name:inBack}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.kicker .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.q{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8.4vw,38px);line-height:1.06;letter-spacing:-.005em;margin:14px 0 0;text-wrap:balance}
.hint{margin:10px 0 0;font-size:15px;line-height:1.45;color:var(--ink-2)}
.group-label{margin:26px 0 10px;font-family:var(--f-label);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}

/* options */
.opts{display:grid;gap:10px;margin-top:22px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:58px;padding:14px 18px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 1px 0 rgba(70,34,47,.04),0 6px 16px -12px rgba(70,34,47,.25);text-align:left;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease}
.opt:active{transform:scale(.98)}
.opt .lbl{flex:1;min-width:0;font-size:16.5px;line-height:1.3}
.opt .sub{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.opt .mark{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--ivory);transition:all .2s ease}
.opt .mark svg{opacity:0;transform:scale(.6);transition:all .2s ease}
.opt[aria-pressed="true"]{background:var(--accent-t);border-color:var(--ink)}
.opt[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .mark svg{opacity:1;transform:none}
.opt.icon{flex-direction:column;align-items:flex-start;gap:10px;min-height:112px;padding:16px}
.opt.icon .ico{width:40px;height:40px;border-radius:14px;background:var(--accent-t);display:inline-flex;align-items:center;justify-content:center}
.opt.icon[aria-pressed="true"] .ico{background:var(--card)}
.opt.icon .mark{position:absolute;top:12px;right:12px;width:22px;height:22px}
.opt.chip{min-height:52px;padding:12px 16px;border-radius:18px}
.opt.chip .lbl{font-size:15.5px}
.opt.wide{grid-column:1 / -1}
.opt[disabled]{opacity:.45;cursor:not-allowed}

/* product tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.tile{position:relative;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--card);border:1.5px solid var(--line);padding:0;cursor:pointer;text-align:left;transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease}
.tile:active{transform:scale(.98)}
.tile img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;max-width:100%}
.tile .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px 13px}
.tile .nm{font-family:var(--f-label);font-weight:500;font-size:11.5px;letter-spacing:.14em}
.tile .fn{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;letter-spacing:0;font-family:var(--f-body)}
.tile .mark{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--ivory)}
.tile .mark svg{opacity:0}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.tile[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink)}
.tile[aria-pressed="true"] .mark svg{opacity:1}
.tile.none{justify-content:center;align-items:center;min-height:100%;padding:18px;background:transparent;border-style:dashed;text-align:center}
.tile.none .nm{font-family:var(--f-body);font-weight:500;letter-spacing:0;font-size:15px}
.tile.none[aria-pressed="true"]{background:var(--accent-t)}
.tiles.ab .tile img{aspect-ratio:3/4}

/* colour swatches */
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.sw{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:150px;padding:16px;border-radius:999px 999px 28px 28px;border:1.5px solid transparent;cursor:pointer;text-align:left;box-shadow:inset 10px 12px 22px rgba(255,255,255,.35),inset -10px -12px 22px rgba(70,34,47,.08);transition:transform .15s ease,box-shadow .2s ease}
.sw:active{transform:scale(.98)}
.sw .lbl{font-family:var(--f-label);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.sw .mark{position:absolute;bottom:13px;right:14px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.7);display:inline-flex;align-items:center;justify-content:center}
.sw .mark svg{opacity:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--ivory),0 0 0 5px var(--ink)}
.sw[aria-pressed="true"] .mark{background:var(--ink)}
.sw[aria-pressed="true"] .mark svg{opacity:1}
.sw.last{grid-column:1 / -1;height:110px;border-radius:999px}

/* scale */
.scale{margin-top:14px}
.scale-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dotbtn{aspect-ratio:1;max-height:64px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-label);font-weight:500;font-size:17px;cursor:pointer;transition:all .2s ease}
.dotbtn[aria-pressed="true"]{background:var(--ink);color:var(--ivory);border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.scale-ends{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--ink-2)}

/* text */
.field{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;color:var(--ink-2)}
textarea,input[type=text],input[type=tel]{width:100%;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:16px 18px;font:inherit;font-size:17px;color:var(--ink);resize:vertical;line-height:1.45}
textarea{min-height:150px}
textarea:focus,input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-t)}

/* media */
.hero-img{margin-top:20px;border-radius:28px;overflow:hidden;background:var(--card);border:1.5px solid var(--line)}
.hero-img img{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover}
.prod-head{display:flex;gap:14px;align-items:center;margin-top:18px;padding:10px;border-radius:24px;background:var(--card);border:1.5px solid var(--line)}
.prod-head img{width:86px;height:108px;object-fit:cover;border-radius:16px;flex-shrink:0}
.prod-head .nm{font-family:var(--f-label);font-weight:500;font-size:13px;letter-spacing:.16em}
.prod-head .fn{font-size:14px;color:var(--ink-2);margin-top:5px;line-height:1.35}

/* footer */
.foot{position:sticky;bottom:0;z-index:5;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(247,241,232,0),var(--ivory) 30%)}
.cta{width:100%;min-height:58px;border:0;border-radius:999px;background:var(--ink);color:var(--ivory);font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .15s ease,opacity .2s ease}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.32;cursor:not-allowed}
.cta.soft{background:var(--accent);color:var(--ink)}
.skip{display:block;margin:8px auto 0;padding:10px 14px;background:none;border:0;font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.counter{font-size:13px;color:var(--ink-2);text-align:center;margin-bottom:8px;min-height:18px}

/* cover & end */
.cover{flex:1;display:flex;flex-direction:column;padding-block:28px 8px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.cover .art{position:relative;height:250px;margin:6px 0 8px;overflow:hidden;border-radius:28px}
.cover .blob{position:absolute;border-radius:50%}
.wm{display:block;height:auto}
.tag{font-family:var(--f-label);font-weight:500;font-size:22px;line-height:1.18;letter-spacing:.02em;margin:22px 0 0}
.lede{font-family:var(--f-display);font-style:italic;font-size:30px;line-height:1.1;margin:22px 0 0;color:var(--deep)}
.body{font-size:16px;line-height:1.55;color:var(--ink-2);margin:12px 0 0;max-width:38ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13px;color:var(--ink-2)}
.demo{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--butter-t);font-size:13px;line-height:1.45;color:var(--ink)}
.end-mark{margin:28px auto 0;display:block}
details.json{margin-top:18px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);padding:12px 14px}
details.json summary{cursor:pointer;font-size:14px;font-weight:600}
details.json pre{margin:10px 0 0;max-height:280px;overflow:auto;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.wait{margin-top:26px;padding:20px;border-radius:24px;background:var(--card);border:1.5px solid var(--line)}
.wait h3{margin:0;font-family:var(--f-label);font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.wait p{margin:8px 0 0;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--ink)}
.ok{margin-top:12px;font-size:14px;font-weight:600;color:var(--deep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:700px){
  .stage{padding-block:24px}
  .app{min-height:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* language switch */
.cover-top{display:flex;justify-content:flex-end;margin-bottom:6px}
.langs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
.lang{min-width:44px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-family:var(--f-label);font-weight:500;font-size:11.5px;letter-spacing:.14em;color:var(--ink-2);cursor:pointer}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
</style>
</head>
<body>


<div class="stage"><main class="app" id="app" aria-live="polite"></main></div>

<script>
/* ============================================================
   NOA Glow Check — questionnaire v2 (FR / ES / EN)
   API vide = mode aperçu (rien n'est envoyé).
   La version en ligne renseigne API: '/api'.
   Les valeurs enregistrées sont identiques dans les 3 langues ;
   seule la clé `lang` indique la langue d'affichage.
   ============================================================ */
const CONFIG = {
  API: '/api',
  VERSION: 'noa-survey-v2',
  IMG: 'img/'
};
const LIVE = !!CONFIG.API;
const post = (path, body) => fetch(CONFIG.API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

/* ---------- language ---------- */
const LANGS = ['fr', 'es', 'en'];
function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang') || location.hash.replace('#', '');
    if (LANGS.includes(q)) return q;
  } catch (e) {}
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'fr']);
  for (const l of list) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS.includes(c)) return c; }
  return 'fr';
}
let LANG = detectLang();
const t = (fr, es, en) => ({ fr, es, en });
const L = (x) => (x && typeof x === 'object' && 'fr' in x) ? (x[LANG] ?? x.fr) : x;
const NUMFMT = { fr: 'fr-FR', es: 'de-DE', en: 'en-US' }; // de-DE: 5.000 (es-ES omits the dot below 10 000)
const n = (v) => new Intl.NumberFormat(NUMFMT[LANG]).format(v).replace(/\s/g, ' ');
const band = (lo, hi) => {
  if (lo == null) return { fr: `Moins de ${n(hi)}`, es: `Menos de ${n(hi)}`, en: `Under ${n(hi)}` }[LANG];
  if (hi == null) return { fr: `Plus de ${n(lo)}`, es: `Más de ${n(lo)}`, en: `Over ${n(lo)}` }[LANG];
  return `${n(lo)} – ${n(hi)}`;
};

const UI = {
  lede: t('On prépare quelque chose pour votre peau.', 'Estamos preparando algo para su piel.', 'We’re making something for your skin.'),
  intro: t('2 minutes. Quelques questions sur votre routine beauté, vos habitudes et ce que vous aimeriez vraiment trouver en skincare.',
           '2 minutos. Algunas preguntas sobre su rutina de belleza, sus hábitos y lo que realmente le gustaría encontrar en el cuidado de la piel.',
           '2 minutes. A few questions about your beauty routine, your habits and what you’d really like to find in skincare.'),
  nQuestions: t('questions', 'preguntas', 'questions'),
  anon: t('Anonyme', 'Anónimo', 'Anonymous'),
  time: t('Environ 2 à 3 min', 'Unos 2 a 3 min', 'About 2–3 min'),
  demo: t('Aperçu : les réponses ne sont pas enregistrées dans cette version.', 'Vista previa: las respuestas no se guardan en esta versión.', 'Preview: answers are not saved in this version.'),
  langLabel: t('Langue', 'Idioma', 'Language'),
  next: t('Continuer', 'Continuar', 'Continue'),
  send: t('Envoyer mes réponses', 'Enviar mis respuestas', 'Send my answers'),
  skip: t('Passer cette question', 'Saltar esta pregunta', 'Skip this question'),
  back: t('Question précédente', 'Pregunta anterior', 'Previous question'),
  selected: t('sélectionné(s)', 'seleccionado(s)', 'selected'),
  maxMsg: t('Maximum {m} choix. Retirez-en un pour en ajouter un autre.', 'Máximo {m} opciones. Quite una para añadir otra.', 'Up to {m} choices. Remove one to add another.'),
  firstTitle: t('Imaginez que vous voyez ces produits pour la première fois.', 'Imagine que ve estos productos por primera vez.', 'Imagine you’re seeing these products for the first time.'),
  firstHint: t('Sur Instagram ou dans une boutique. Répondez à l’instinct : il n’y a ni bonne ni mauvaise réponse.', 'En Instagram o en una tienda. Responda por instinto: no hay respuestas buenas ni malas.', 'On Instagram or in a shop. Go with your gut: there are no right or wrong answers.'),
  firstCta: t('Je regarde', 'Vamos a ver', 'Let’s look'),
  collectionAlt: t('Cinq produits de soin : nettoyant rose, sérum pêche, sérum lilas, crème jaune, protection solaire ivoire', 'Cinco productos: limpiador rosa, sérum melocotón, sérum lila, crema amarilla, protector solar marfil', 'Five skincare products: pink cleanser, peach serum, lilac serum, yellow cream, ivory sunscreen'),
  likely: t('À quel point seriez-vous susceptible de l’acheter ?', '¿Qué probabilidad hay de que lo compre?', 'How likely would you be to buy it?'),
  notAtAll: t('Pas du tout', 'Nada probable', 'Not at all'),
  definitely: t('Certainement', 'Seguro que sí', 'Definitely'),
  priceTitle: t('Parlons prix.', 'Hablemos de precio.', 'Let’s talk price.'),
  priceOk: t('Quel prix vous semblerait raisonnable ?', '¿Qué precio le parecería razonable?', 'What price would feel reasonable?'),
  priceHigh: t('À partir de quel prix ce serait trop cher ?', '¿A partir de qué precio sería demasiado caro?', 'At what price would it be too expensive?'),
  priceNote: t('Prix en FCFA.', 'Precios en FCFA.', 'Prices in FCFA.'),
  unknown: t('Je ne sais pas', 'No lo sé', 'I don’t know'),
  format: t('FORMAT', 'FORMATO', 'FORMAT'),
  dome: t('Pot à dôme', 'Tarro con cúpula', 'Dome jar'),
  pump: t('Flacon pompe', 'Frasco con dosificador', 'Pump bottle'),
  noPref: t('Aucune préférence', 'Sin preferencia', 'No preference'),
  none: t('Aucun', 'Ninguno', 'None'),
  endBody: t('Vos réponses vont nous aider à créer quelque chose que vous aurez réellement envie d’utiliser.', 'Sus respuestas nos ayudarán a crear algo que realmente tenga ganas de usar.', 'Your answers will help us create something you’ll actually want to use.'),
  sendFail: t('Vos réponses n’ont pas pu être envoyées (connexion).', 'No se pudieron enviar sus respuestas (conexión).', 'Your answers couldn’t be sent (connection).'),
  retry: t('Réessayer', 'Reintentar', 'Try again'),

function header(q) {
  const k = NUMBERED.indexOf(q) + 1;
  const pct = q.type === 'intro' ? (NUMBERED.indexOf(Q[S.i + 1]) / TOTAL) * 100 : (k / TOTAL) * 100;
  const label = q.type === 'intro' ? '' : `${String(k).padStart(2, '0')} / ${TOTAL}`;
  return `<div class="top">
    <div class="top-row">
      <button class="back" id="btn-back" aria-label="${esc(L(UI.back))}">${BACK}</button>
      ${WM('#46222F', 64)}
      <span class="count">${label}</span>
    </div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
  </div>`;
}
function kicker(q) { const s = SECTION[q.section]; return `<span class="kicker"><span class="dot"></span>${s.n} — ${esc(s.t)}</span>`; }
function optBtn(key, val, label, selected, extra = '') {
  label = String(label).replace(/(\d) (\d)/g, '$1 $2');
  return `<button type="button" class="opt ${extra}" data-key="${key}" data-val="${esc(val)}" aria-pressed="${selected}"><span class="lbl">${esc(label)}</span><span class="mark">${CHECK}</span></button>`;
}
function optionsGrid(key, opts, layout, isSelected, iconMode, fcfa) {
  return `<div class="opts ${layout === 'two' ? 'two' : ''}">${opts.map(([v, l, wide, , ico]) => {
    const sel = isSelected(v), lab = optLabel(l, fcfa);
    if (iconMode) return `<button type="button" class="opt icon ${wide ? 'wide' : ''}" data-key="${key}" data-val="${esc(v)}" aria-pressed="${sel}"><span class="ico">${ICONS[ico]}</span><span class="lbl">${esc(lab)}</span><span class="mark">${CHECK}</span></button>`;
    return optBtn(key, v, lab, sel, wide && layout === 'two' ? 'wide' : '');
  }).join('')}</div>`;
}
function tile(key, id, sel) {
  const p = P(id);
  return `<button type="button" class="tile" data-key="${key}" data-val="${id}" aria-pressed="${sel}"><img src="${CONFIG.IMG}p-${id}.jpg" alt="${esc(p.name)}, ${esc(L(p.fn))}" loading="lazy"><span class="cap"><span><span class="nm">${esc(p.name)}</span><span class="fn">${esc(L(p.fn))}</span></span><span class="mark">${CHECK}</span></span></button>`;
}
function noneTile(key, label, sel) {
  return `<button type="button" class="tile none" data-key="${key}" data-val="none" aria-pressed="${sel}"><span class="nm">${esc(L(label))}</span></button>`;
}
function footer(label, enabled, opts = {}) {
  return `<div class="foot">
    ${opts.counter !== undefined ? `<div class="counter" id="counter">${opts.counter}</div>` : ''}
    <button type="button" class="cta" id="btn-next" ${enabled ? '' : 'disabled'}>${esc(L(label))} ${ARROW}</button>
    ${opts.skip ? `<button type="button" class="skip" id="btn-skip">${esc(L(UI.skip))}</button>` : ''}
  </div>`;
}
function langSwitch() {
  return `<div class="langs" role="group" aria-label="${esc(L(UI.langLabel))}">${LANGS.map(l => `<button type="button" class="lang" data-lang="${l}" aria-pressed="${l === LANG}" lang="${l}">${l.toUpperCase()}</button>`).join('')}</div>`;
}

/* ---------- screens ---------- */
function renderCover() {
  setAccent('pink');
  app.innerHTML = `<section class="cover">
    <div class="cover-top">${langSwitch()}</div>
    <div class="art" aria-hidden="true">
      <div class="blob" style="width:230px;height:230px;left:-40px;top:6px;background:var(--pink)"></div>
      <div class="blob" style="width:150px;height:150px;left:150px;top:0;background:var(--lilac);opacity:.85"></div>
      <div class="blob" style="width:120px;height:120px;right:-14px;top:96px;background:var(--butter)"></div>
      <div class="blob" style="width:96px;height:96px;left:178px;top:150px;background:var(--peach)"></div>
      <div style="position:absolute;left:28px;top:70px">${RING('#F7F1E8', 96)}</div>
    </div>
    ${WM('#46222F', 210)}
    <p class="tag">LESS NOISE.<br>MORE GLOW.</p>
    <p class="lede">${esc(L(UI.lede))}</p>
    <p class="body">${esc(L(UI.intro))}</p>
    <div class="meta"><span class="pill">${TOTAL} ${esc(L(UI.nQuestions))}</span><span class="pill">${esc(L(UI.anon))}</span><span class="pill">${esc(L(UI.time))}</span></div>
    ${LIVE ? '' : `<div class="demo">${esc(L(UI.demo))}</div>`}
  </section>
  <div class="foot"><button type="button" class="cta soft" id="btn-start">LET’S GLOW ${ARROW}</button></div>`;
  app.querySelectorAll('.lang').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  document.getElementById('btn-start').onclick = () => { S.startedAt = S.startedAt || new Date().toISOString(); go(0, 1); };
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l; document.documentElement.lang = l;
  if (S.i < 0) renderCover(); else renderQuestion();
}

function renderQuestion() {
  const q = Q[S.i];
  setAccent(SECTION[q.section].c);
  const A = S.answers;
  let inner = '', foot = '';

  if (q.type === 'intro') {
    inner = `<span class="kicker"><span class="dot"></span>05 — First impression</span>
      <h1 class="q">${esc(L(UI.firstTitle))}</h1>
      <p class="hint">${esc(L(UI.firstHint))}</p>
      <div class="hero-img"><img src="${CONFIG.IMG}collection.jpg" alt="${esc(L(UI.collectionAlt))}"></div>`;
    foot = footer(UI.firstCta, true);
  }

  if (q.type === 'single') {
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>${q.hint ? `<p class="hint">${esc(L(q.hint))}</p>` : ''}
      ${q.image ? `<div class="hero-img"><img src="${CONFIG.IMG}${q.image}" alt="${esc(L(UI.collectionAlt))}"></div>` : ''}
      ${optionsGrid(q.id, q.options, q.layout, v => A[q.id] === v, false, q.fcfa)}`;
    foot = footer(UI.next, !!A[q.id]);
  }

  if (q.type === 'multi') {
    const cur = A[q.id] || [];
    const isNone = cur.some(v => (q.options.find(o => o[0] === v) || [])[3] === 'exclusive');
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>${q.hint ? `<p class="hint">${esc(L(q.hint))}</p>` : ''}
      ${optionsGrid(q.id, q.options, q.layout, v => cur.includes(v), q.icons)}`;
    const counter = cur.length ? (q.max ? `${cur.length} / ${q.max} ${L(UI.selected)}` : `${cur.length} ${L(UI.selected)}`) : '';
    foot = footer(UI.next, cur.length > 0, { counter: isNone ? '' : counter });
  }

  if (q.type === 'groups') {
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>
      ${q.groups.map(g => `<div class="group-label" id="lbl-${g.key}">${esc(L(g.label))}</div>${optionsGrid(g.key, g.options, g.layout, v => A[g.key] === v).replace('class="opts', `role="group" aria-labelledby="lbl-${g.key}" class="opts`)}`).join('')}`;
    foot = footer(UI.next, q.groups.every(g => A[g.key]));
  }

  if (q.type === 'text') {
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>${q.hint ? `<p class="hint">${esc(L(q.hint))}</p>` : ''}
      <div class="field"><label for="txt-${q.id}" class="sr">${esc(L(q.title))}</label>
      <textarea id="txt-${q.id}" rows="${q.rows || 4}" maxlength="600" placeholder="${esc(L(q.placeholder) || '')}">${esc(A[q.id] || '')}</textarea></div>`;
    const last = S.i === Q.length - 1;
    foot = footer(last ? UI.send : UI.next, !!(A[q.id] || '').trim(), { skip: q.optional });
  }

  if (q.type === 'color') {
    const cols = ORDER.colors.map(id => COLORS.find(c => c.id === id));
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>
      <div class="swatches" role="group">${cols.map((c, i) => `<button type="button" class="sw ${i === cols.length - 1 ? 'last' : ''}" style="background:${c.hex};${c.id === 'ivory' ? 'border-color:rgba(70,34,47,.16);' : ''}" data-key="${q.id}" data-val="${c.id}" aria-pressed="${A[q.id] === c.id}"><span class="lbl">${esc(L(c.label))}</span><span class="mark">${CHECK}</span></button>`).join('')}</div>`;
    foot = footer(UI.next, !!A[q.id]);
  }

  if (q.type === 'product') {
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>${q.hint ? `<p class="hint">${esc(L(q.hint))}</p>` : ''}
      <div class="tiles" role="group">${ORDER.products.map(id => tile(q.id, id, A[q.id] === id)).join('')}${q.none ? noneTile(q.id, q.none, A[q.id] === 'none') : ''}</div>`;
    foot = footer(UI.next, !!A[q.id]);
  }

  if (q.type === 'ab') {
    const order = S.abOrder || (S.abOrder = shuffle(['a', 'b']));
    const img = { a: 'p-milk.jpg', b: 'milk-b.jpg' };
    const lab = { a: L(UI.dome), b: L(UI.pump) };
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1><p class="hint">${esc(L(q.hint))}</p>
      <div class="tiles ab" role="group">${order.map((k, i) => `<button type="button" class="tile" data-key="${q.id}" data-val="${k}" aria-pressed="${A[q.id] === k}"><img src="${CONFIG.IMG}${img[k]}" alt="${esc(L(UI.format))} ${i + 1} : ${esc(lab[k])}"><span class="cap"><span><span class="nm">${esc(L(UI.format))} ${i + 1}</span><span class="fn">${esc(lab[k])}</span></span><span class="mark">${CHECK}</span></span></button>`).join('')}</div>
      <div class="opts">${optBtn(q.id, 'none', L(UI.noPref), A[q.id] === 'none', 'chip')}</div>`;
    foot = footer(UI.next, !!A[q.id]);
  }

  if (q.type === 'buy') {
    const pick = A.buy_now;
    inner = `${kicker(q)}<h1 class="q">${esc(L(q.title))}</h1>
      <div class="tiles" role="group">${ORDER.products.map(id => tile('buy_now', id, pick === id)).join('')}${noneTile('buy_now', UI.none, pick === 'none')}</div>
      ${pick && pick !== 'none' ? `<div class="group-label" id="lbl-lk">${esc(L(UI.likely))}</div>
      <div class="scale" role="group" aria-labelledby="lbl-lk"><div class="scale-row">${[1, 2, 3, 4, 5].map(k => `<button type="button" class="dotbtn" data-key="buy_likelihood" data-val="${k}" aria-pressed="${A.buy_likelihood === String(k)}" aria-label="${k} / 5">${k}</button>`).join('')}</div>
      <div class="scale-ends"><span>${esc(L(UI.notAtAll))}</span><span>${esc(L(UI.definitely))}</span></div></div>` : ''}`;
    foot = footer(UI.next, pick === 'none' || (pick && A.buy_likelihood));
  }

  if (q.type === 'price') {
    const p = P(q.product);
    const k1 = q.id + '_reasonable', k2 = q.id + '_too_expensive';
    const chips = (key) => q.bands.map(([v, l]) => optBtn(key, v, optLabel(l, false), A[key] === v, 'chip')).join('');
    inner = `${kicker(q)}<h1 class="q">${esc(L(UI.priceTitle))}</h1>
      <div class="prod-head"><img src="${CONFIG.IMG}${q.image}" alt="${esc(p.name)}"><div><div class="nm">${esc(p.name)}</div><div class="fn">${esc(L(q.size))}</div></div></div>
      <div class="group-label" id="lbl-${k1}">${esc(L(UI.priceOk))}</div>
      <div class="opts two" role="group" aria-labelledby="lbl-${k1}">${chips(k1)}</div>
      <div class="group-label" id="lbl-${k2}">${esc(L(UI.priceHigh))}</div>
      <div class="opts two" role="group" aria-labelledby="lbl-${k2}">${chips(k2)}</div>
      <p class="hint" style="margin-top:14px">${esc(L(UI.priceNote))}</p>`;
    foot = footer(UI.next, !!(A[k1] && A[k2]));
  }

  app.innerHTML = header(q) + `<section class="screen ${S.dir < 0 ? 'back-anim' : ''}">${inner}</section>` + foot;
  bind(q);
  window.scrollTo(0, 0);
}

/* ---------- interactions ---------- */
let autoTimer = null;
function bind(q) {
  document.getElementById('btn-back').onclick = () => go(S.i - 1, -1);
  const next = document.getElementById('btn-next');
  if (next) next.onclick = () => advance(q);
  const skip = document.getElementById('btn-skip');
  if (skip) skip.onclick = () => { S.answers[q.id] = ''; advance(q); };
  const ta = app.querySelector('textarea');
  if (ta) ta.addEventListener('input', () => { S.answers[q.id] = ta.value; next.disabled = !ta.value.trim(); });
  app.querySelectorAll('[data-key]').forEach(btn => btn.addEventListener('click', () => choose(q, btn.dataset.key, btn.dataset.val)));
}

function choose(q, key, val) {
  const A = S.answers;
  clearTimeout(autoTimer);
  if (q.type === 'multi') {
    let cur = (A[key] || []).slice();
    const opt = q.options.find(o => o[0] === val);
    const exclusive = opt && opt[3] === 'exclusive';
    if (cur.includes(val)) cur = cur.filter(v => v !== val);
    else if (exclusive) cur = [val];
    else {
      cur = cur.filter(v => (q.options.find(o => o[0] === v) || [])[3] !== 'exclusive');
      if (q.max && cur.length >= q.max) { flashCounter(L(UI.maxMsg).replace('{m}', q.max)); return; }
      cur.push(val);
    }
    A[key] = cur;
    renderQuestion();
    return;
  }
  if (key === 'buy_now' && A.buy_now !== val) delete A.buy_likelihood;
  A[key] = val;
  renderQuestion();
  const auto = ['single', 'color', 'product', 'ab'].includes(q.type) || (q.type === 'buy' && (key === 'buy_likelihood' || val === 'none'));
  if (auto) autoTimer = setTimeout(() => advance(q), 380);
}
function flashCounter(msg) { const c = document.getElementById('counter'); if (c) { c.textContent = msg; c.style.color = 'var(--deep)'; } }

function advance(q) {
  if (q.id === 'profile' && S.answers.age === 'u18') { S.minor = true; return renderMinor(); }
  if (S.i >= Q.length - 1) return submit();
  go(S.i + 1, 1);
}
function go(i, dir) {
  S.dir = dir;
  if (i < 0) { S.i = -1; return renderCover(); }
  S.i = i;
  renderQuestion();
}

/* ---------- submit ---------- */
function payload() {
  const A = S.answers;
  const submittedAt = new Date().toISOString();
  return {
    version: CONFIG.VERSION,
    started_at: S.startedAt,
    submitted_at: submittedAt,
    duration_sec: Math.round((Date.parse(submittedAt) - Date.parse(S.startedAt)) / 1000),
    country: A.country || null,
    age: A.age || null,
    lang: LANG,
    display_order: { products: ORDER.products, colors: ORDER.colors, milk_ab: S.abOrder || null },
    answers: A
  };
}
async function submit() {
  const data = payload();
  S.done = true;
  let saved = false;
  if (LIVE) {
    try { const r = await post('/response', data); saved = r.ok; } catch (e) { saved = false; }
  }
  renderEnd(data, saved);
}

function renderEnd(data, saved) {
  setAccent('pink');
  app.innerHTML = `<section class="cover" style="padding-top:44px">
    ${WM('#46222F', 150)}
    <h1 class="q" style="font-family:var(--f-label);font-weight:500;font-size:26px;line-height:1.2;letter-spacing:.02em;margin-top:34px">THANK YOU,<br>GLOW GIRL.</h1>
    <p class="body" style="font-size:17px;color:var(--ink)">${esc(L(UI.endBody))}</p>
    ${LIVE && !saved ? `<div class="demo">${esc(L(UI.sendFail))} <button type="button" class="skip" id="btn-retry" style="display:inline;margin:0;padding:0">${esc(L(UI.retry))}</button></div>` : ''}
    <div class="wait">
      <h3>${esc(L(UI.waitTitle))}</h3>
      <p>${esc(L(UI.waitBody))}</p>
      <div class="field" style="margin-top:12px"><label for="wa">${esc(L(UI.waitLabel))}</label><input type="tel" id="wa" inputmode="tel" autocomplete="tel" placeholder="+241 …"></div>
      <label class="check"><input type="checkbox" id="wa-ok"> ${esc(L(UI.waitConsent))}</label>
      <button type="button" class="cta" id="btn-wa" style="margin-top:14px" disabled>${esc(L(UI.waitBtn))}</button>
      <div class="ok" id="wa-msg" role="status"></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:30px">${RING('#F2A7B8', 40)}<p class="tag" style="margin:0;font-size:16px">LESS NOISE.<br>MORE GLOW.</p></div>
    ${LIVE ? '' : `<details class="json"><summary>${esc(L(UI.jsonSummary))}</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`}
  </section>`;
  const wa = document.getElementById('wa'), ok = document.getElementById('wa-ok'), b = document.getElementById('btn-wa'), msg = document.getElementById('wa-msg');
  const valid = () => { b.disabled = !(ok.checked && wa.value.replace(/\D/g, '').length >= 8); };
  wa.addEventListener('input', valid); ok.addEventListener('change', valid);
  b.onclick = async () => {
    b.disabled = true;
    if (!LIVE) { msg.textContent = L(UI.waitPreview); return; }
    try {
      const r = await post('/waitlist', { phone: wa.value.trim(), country: data.country, consent: true, version: CONFIG.VERSION });
      msg.textContent = r.ok ? L(UI.waitOk) : L(UI.waitFail);
      if (!r.ok) b.disabled = false;
    } catch (e) { msg.textContent = L(UI.offline); b.disabled = false; }
  };
  const retry = document.getElementById('btn-retry');
  if (retry) retry.onclick = submit;
  window.scrollTo(0, 0);
}

function renderMinor() {
  setAccent('pink');
  app.innerHTML = `<section class="cover" style="padding-top:44px">
    ${WM('#46222F', 150)}
    <h1 class="q" style="margin-top:30px">${esc(L(UI.minorTitle))}</h1>
    <p class="body" style="font-size:17px;color:var(--ink)">${esc(L(UI.minorBody))}</p>
    <div style="display:flex;align-items:center;gap:14px;margin-top:30px">${RING('#F2A7B8', 40)}<p class="tag" style="margin:0;font-size:16px">LESS NOISE.<br>MORE GLOW.</p></div>
  </section>
  <div class="foot"><button type="button" class="cta soft" id="btn-fix">${esc(L(UI.minorBtn))}</button></div>`;
  document.getElementById('btn-fix').onclick = () => { delete S.answers.age; S.minor = false; go(0, -1); };
}

renderCover();
</script>

</body>
</html>
